services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-wansnap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wansnap}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wansnap}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-wansnap}:${MYSQL_PASSWORD:-wansnap}@db:3306/${MYSQL_DATABASE:-wansnap}
      NODE_ENV: development
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      # ブラウザ（Client Components）から叩くURL
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Server Components / Server Actions がコンテナ内部から叩くURL
      API_INTERNAL_URL: http://api:3001
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - api

volumes:
  mysql_data:
