<!--
  subject: wansnap へのログインリンク
  template: Confirm signup（新規ユーザーのマジックリンク）
  貼り付け先: Supabase → Authentication → Email Templates → Confirm signup
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#F4EDE0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#F4EDE0;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#FFFEFB;border-radius:20px;overflow:hidden;">

          <!-- ヘッダー -->
          <tr>
            <td align="center" style="background:#1F1A14;padding:28px 32px;">
              <span style="color:#FFFEFB;font-size:18px;font-weight:600;letter-spacing:-0.01em;">🐾 wansnap</span>
            </td>
          </tr>

          <!-- 本文 -->
          <tr>
            <td style="padding:40px 32px 16px;">
              <p style="margin:0 0 8px;font-size:22px;font-weight:700;color:#1F1A14;letter-spacing:-0.01em;">ログインリンクが届きました</p>
              <p style="margin:0 0 32px;font-size:14px;color:#4A4239;line-height:1.7;">
                下のボタンをタップしてログインしてください。<br>
                このリンクは1回のみ有効で、有効期限があります。
              </p>
              <table cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;background:#1F1A14;color:#FFFEFB;text-decoration:none;font-size:15px;font-weight:600;padding:14px 40px;border-radius:999px;letter-spacing:0.01em;">
                      wansnap にログイン
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- フッター -->
          <tr>
            <td style="padding:32px 32px 40px;border-top:1px solid rgba(31,26,20,0.08);margin-top:32px;">
              <p style="margin:0;font-size:11.5px;color:#7E7567;line-height:1.7;">
                このメールに心当たりがない場合は無視していただいて構いません。<br>
                リンクをクリックしない限り、アカウントは変更されません。
              </p>
              <p style="margin:16px 0 0;font-size:11px;color:#B8AE9E;">
                wansnap — 犬種ごとにサイズ感とコーデが見つかる、愛犬家のコミュニティ
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
