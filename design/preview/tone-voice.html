<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Tone of voice</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px; background: var(--ws-bg);
    color: var(--ws-fg); font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em;
    min-height: 380px;
  }
  * { box-sizing: border-box; }
  .eb { font: 500 9.5px/1 var(--ws-font-sans); text-transform: uppercase; letter-spacing: 0.2em; color: var(--ws-fg-faint); }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
</style></head>
<body>
    <div class="eb">Tone of voice · 大人っぽく、温かく、句点でリズム</div>

    <div style="margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div style="padding:16px 18px;background:var(--ws-paper);border-radius:14px;border:1px solid var(--ws-hairline);">
        <div style="font-size:11px;color:var(--ws-forest);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
          <span style="width:6px;height:6px;border-radius:6px;background:var(--ws-forest);"></span>
          DO · ブランドらしい
        </div>
        <div style="font-size:13px;color:var(--ws-fg);line-height:1.7;">
          ・ 「愛犬の今日の一枚を、世界へ。」<br/>
          ・ 「新宿中央公園で初めてのバンダナデビュー🌿」<br/>
          ・ 「次へ · 愛犬の情報 →」<br/>
          ・ 「リネン素材だから夏でも蒸れない。」
        </div>
      </div>

      <div style="padding:16px 18px;background:var(--ws-paper);border-radius:14px;border:1px solid rgba(185,90,61,0.18);">
        <div style="font-size:11px;color:var(--ws-terracotta);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
          <span style="width:6px;height:6px;border-radius:6px;background:var(--ws-terracotta);"></span>
          DON'T · 避ける
        </div>
        <div style="font-size:13px;color:var(--ws-fg);line-height:1.7;">
          ・ 「ワンちゃんのお洋服コーデを大募集！🐶✨💕」<br/>
          ・ 「めっちゃカワイイ！」<br/>
          ・ 「みんなで楽しくシェアしよう！」<br/>
          ・ 過剰な敬語 / 子供っぽい絵文字連発
        </div>
      </div>
    </div>

    <div style="margin-top:18px;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--ws-fg-muted);">
      <div><span class="mono" style="color:var(--ws-fg);">。</span> ブランドアクセント — 句点はテラコッタ着色OK</div>
      <div><span class="mono" style="color:var(--ws-fg);">·</span> 中黒で項目を繋ぐ — 柴犬・赤 / 9.5kg · 胴囲48cm</div>
      <div><span class="mono" style="color:var(--ws-fg);">→</span> CTA は動詞 + 矢印</div>
    </div>
  </body></html>
