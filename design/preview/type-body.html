<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Body type</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px;
    background: var(--ws-bg);
    color: var(--ws-fg);
    font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased;
    letter-spacing: var(--ws-track-body);
    min-height: 260px;
  }
  * { box-sizing: border-box; }
  .eb {
    font: 500 9.5px/1 var(--ws-font-sans);
    text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--ws-fg-faint);
  }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
  .swatch {
    border-radius: 10px;
    border: 1px solid var(--ws-hairline);
  }
  .label-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 8px;
  }
  .label-row .name { font: 500 11px/1 var(--ws-font-sans); color: var(--ws-fg); }
  .label-row .hex { font-family: var(--ws-font-mono); font-size: 10px; color: var(--ws-fg-faint); letter-spacing: -0.02em; }
  .label-row .var { font-family: var(--ws-font-mono); font-size: 10px; color: var(--ws-fg-faint); letter-spacing: -0.02em; }
</style></head>
<body>

    <div class="eb">Body · Zen Kaku Gothic New</div>
    <div style="margin-top:10px;display:grid;grid-template-columns:80px 1fr;gap:10px 16px;align-items:baseline;">
      <div class="mono" style="font-size:11px;color:var(--ws-fg-faint);">16 / 500</div>
      <div style="font-size:16px;font-weight:500;line-height:1.55;">愛犬の今日の一枚を、世界へ。</div>
      <div class="mono" style="font-size:11px;color:var(--ws-fg-faint);">14 / 500</div>
      <div style="font-size:14px;font-weight:500;line-height:1.55;">新宿中央公園で初めてのバンダナデビュー。リネン素材だから夏でも蒸れない。</div>
      <div class="mono" style="font-size:11px;color:var(--ws-fg-faint);">13 / 400</div>
      <div style="font-size:13px;font-weight:400;line-height:1.5;color:var(--ws-fg-muted);">朝はいつも代々木公園を散歩。少しゆとりのある服が好み。</div>
      <div class="mono" style="font-size:11px;color:var(--ws-fg-faint);">11.5 / 500</div>
      <div style="font-size:11.5px;font-weight:500;line-height:1.45;color:var(--ws-fg-faint);">続行することで、利用規約とプライバシーポリシーに同意したものとみなされます</div>
    </div>
  
</body></html>
