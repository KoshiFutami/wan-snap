<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px;
    background: var(--ws-bg);
    color: var(--ws-fg);
    font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased;
    letter-spacing: var(--ws-track-body);
    min-height: 280px;
  }
  * { box-sizing: border-box; }
  .eb {
    font: 500 9.5px/1 var(--ws-font-sans);
    text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--ws-fg-faint);
  }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
  .swatch {
    border-radius: 10px;
    border: 1px solid var(--ws-hairline);
  }
  .label-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 8px;
  }
  .label-row .name { font: 500 11px/1 var(--ws-font-sans); color: var(--ws-fg); }
  .label-row .hex { font-family: var(--ws-font-mono); font-size: 10px; color: var(--ws-fg-faint); letter-spacing: -0.02em; }
  .label-row .var { font-family: var(--ws-font-mono); font-size: 10px; color: var(--ws-fg-faint); letter-spacing: -0.02em; }
</style></head>
<body>

    <div class="eb">Display · Noto Serif JP / 500</div>
    <div style="margin-top:8px;font-family:var(--ws-font-serif);font-weight:500;color:var(--ws-fg);">
      <div style="font-size:64px;line-height:0.95;letter-spacing:-0.025em;">Wan-Snap<span style="color:var(--ws-terracotta)">.</span></div>
      <div style="font-size:40px;line-height:1;letter-spacing:-0.015em;margin-top:14px;">今日のスナップ。</div>
      <div style="font-size:24px;line-height:1.1;letter-spacing:-0.01em;margin-top:14px;">これまでのスナップ</div>
      <div style="font-size:18px;line-height:1.1;letter-spacing:-0.005em;margin-top:14px;">基本情報</div>
    </div>
    <div style="display:flex;gap:32px;margin-top:18px;font-family:var(--ws-font-mono);font-size:10px;color:var(--ws-fg-faint);letter-spacing:-0.02em;">
      <span>64 / -0.025em</span><span>40 / -0.015em</span><span>24 / -0.01em</span><span>18 / -0.005em</span>
    </div>
  
</body></html>
