<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Form fields</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px; background: var(--ws-bg);
    color: var(--ws-fg); font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em;
    min-height: 320px;
  }
  * { box-sizing: border-box; }
  .eb {
    font: 500 9.5px/1 var(--ws-font-sans);
    text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--ws-fg-faint);
  }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    padding: 12px 22px; border-radius: 9999px; border: none;
    font: 600 13px/1 var(--ws-font-sans); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    letter-spacing: 0.02em;
  }
  .btn-primary { background: var(--ws-ink); color: var(--ws-cream); }
  .btn-terra   { background: var(--ws-terracotta); color: #fff; box-shadow: 0 6px 18px rgba(185,90,61,0.35); }
  .btn-ghost   { background: var(--ws-paper); color: var(--ws-fg); border: 1px solid var(--ws-hairline-strong); }
  .btn-danger  { background: transparent; color: var(--ws-terracotta); border: 1px solid var(--ws-terracotta); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px;
    background: var(--ws-paper); border: 1px solid var(--ws-hairline);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ws-fg); cursor: pointer; padding: 0;
  }
  .chip {
    padding: 7px 13px; border-radius: 9999px;
    border: 1px solid var(--ws-hairline-strong);
    background: transparent; color: var(--ws-fg);
    font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip-on { background: var(--ws-ink); color: var(--ws-cream); border-color: var(--ws-ink); }
  .chip-on-terra { background: var(--ws-terracotta); color: #fff; border-color: var(--ws-terracotta); }
  .dot { width: 6px; height: 6px; border-radius: 6px; background: var(--ws-terracotta); }
</style></head>
<body>

    <div class="eb">Text field · Select · Multiline</div>
    <div style="margin-top:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:700px;">
      <div>
        <div style="font-size:11.5px;font-weight:500;color:var(--ws-fg);margin-bottom:6px;letter-spacing:0.02em;">名前 <span style="color:var(--ws-terracotta);">*</span></div>
        <div style="background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;height:46px;padding:0 14px;display:flex;align-items:center;font-size:14px;color:var(--ws-fg);">エマ</div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
          <div style="font-size:11.5px;font-weight:500;color:var(--ws-fg);">体重 <span style="color:var(--ws-terracotta);">*</span></div>
          <div style="font-size:10px;color:var(--ws-fg-faint);">kg単位で</div>
        </div>
        <div style="background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;">
          <span style="flex:1;font-size:14px;color:var(--ws-fg);">9.5</span>
          <span class="mono" style="font-size:11px;color:var(--ws-fg-faint);">kg</span>
        </div>
      </div>
      <div>
        <div style="font-size:11.5px;font-weight:500;color:var(--ws-fg);margin-bottom:6px;">犬種</div>
        <div style="background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;">
          <span style="flex:1;font-size:14px;color:var(--ws-fg);">柴犬</span>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M4 6l4 4 4-4" stroke="var(--ws-ink-50)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div>
        <div style="font-size:11.5px;font-weight:500;color:var(--ws-fg);margin-bottom:6px;">パスワード <span style="color:var(--ws-terracotta);">*</span></div>
        <div style="background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;height:46px;padding:0 14px;display:flex;align-items:center;">
          <span style="flex:1;font-size:14px;color:var(--ws-ink-30);">8文字以上</span>
        </div>
      </div>
    </div>

    <div style="margin-top:14px;max-width:700px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
        <div style="font-size:11.5px;font-weight:500;color:var(--ws-fg);">キャプション</div>
        <div style="font-size:10px;color:var(--ws-fg-faint);">142 / 500</div>
      </div>
      <div style="background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ws-fg);line-height:1.55;">
        新宿中央公園で初めてのバンダナデビュー🌿 リネン素材だから夏でも蒸れないし、首回りもゆとりあって◎
      </div>
    </div>
  
</body></html>
