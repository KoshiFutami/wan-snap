<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px;
    background: var(--ws-bg);
    color: var(--ws-fg);
    font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased;
    letter-spacing: var(--ws-track-body);
    min-height: 200px;
  }
  * { box-sizing: border-box; }
  .eb {
    font: 500 9.5px/1 var(--ws-font-sans);
    text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--ws-fg-faint);
  }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
  .swatch {
    border-radius: 10px;
    border: 1px solid var(--ws-hairline);
  }
  .label-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 8px;
  }
  .label-row .name { font: 500 11px/1 var(--ws-font-sans); color: var(--ws-fg); }
  .label-row .hex { font-family: var(--ws-font-mono); font-size: 10px; color: var(--ws-fg-faint); letter-spacing: -0.02em; }
  .label-row .var { font-family: var(--ws-font-mono); font-size: 10px; color: var(--ws-fg-faint); letter-spacing: -0.02em; }
</style></head>
<body>

    <div class="eb">Elevation · Use sparingly</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;">
      
        <div>
          <div style="width:100%;height:80px;background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:14px;box-shadow:none;"></div>
          <div class="label-row"><span class="name">None</span></div>
          <div style="font-size:10px;color:var(--ws-fg-faint);margin-top:4px;line-height:1.4;">デフォルト · hairline のみ</div>
        </div>
      
        <div>
          <div style="width:100%;height:80px;background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:14px;box-shadow:0 4px 14px rgba(31,26,20,0.06);"></div>
          <div class="label-row"><span class="name">Card</span></div>
          <div style="font-size:10px;color:var(--ws-fg-faint);margin-top:4px;line-height:1.4;">カード hover / pop</div>
        </div>
      
        <div>
          <div style="width:100%;height:80px;background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:14px;box-shadow:0 6px 18px rgba(31,26,20,0.10);"></div>
          <div class="label-row"><span class="name">Pop</span></div>
          <div style="font-size:10px;color:var(--ws-fg-faint);margin-top:4px;line-height:1.4;">Floating CTA</div>
        </div>
      
        <div>
          <div style="width:100%;height:80px;background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,0.4);"></div>
          <div class="label-row"><span class="name">Modal</span></div>
          <div style="font-size:10px;color:var(--ws-fg-faint);margin-top:4px;line-height:1.4;">モーダル · 重め</div>
        </div>
      
    </div>
  
</body></html>
