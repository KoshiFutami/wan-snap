<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Notification badges</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px; background: var(--ws-bg);
    color: var(--ws-fg); font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em;
    min-height: 220px;
  }
  * { box-sizing: border-box; }
  .eb { font: 500 9.5px/1 var(--ws-font-sans); text-transform: uppercase; letter-spacing: 0.2em; color: var(--ws-fg-faint); }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
</style></head>
<body>
    <div class="eb">Notification badges · 行動別カラーコード</div>
    <div style="margin-top:18px;display:flex;gap:14px;flex-wrap:wrap;">
      
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;">
          <div style="position:relative;width:32px;height:32px;">
            <div style="width:32px;height:32px;border-radius:16px;background:var(--ws-cream);"></div>
            <div style="position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:9px;background:var(--ws-terracotta);display:flex;align-items:center;justify-content:center;border:2px solid var(--ws-paper);">
              <svg width="10" height="10" viewBox="0 0 12 12" fill="#fff"><path d="M6 11s-4-2.5-4-5.5C2 4 3 3 4.3 3c.9 0 1.4.5 1.7 1 .3-.5.8-1 1.7-1C9 3 10 4 10 5.5 10 8.5 6 11 6 11z"/></svg>
            </div>
          </div>
          <span style="font-size:12px;color:var(--ws-fg);font-weight:500;">いいね</span>
        </div>
      
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;">
          <div style="position:relative;width:32px;height:32px;">
            <div style="width:32px;height:32px;border-radius:16px;background:var(--ws-cream);"></div>
            <div style="position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:9px;background:var(--ws-forest);display:flex;align-items:center;justify-content:center;border:2px solid var(--ws-paper);">
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 3h8v5H6L4 9.5V8H2V3z" fill="#fff"/></svg>
            </div>
          </div>
          <span style="font-size:12px;color:var(--ws-fg);font-weight:500;">コメント</span>
        </div>
      
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;">
          <div style="position:relative;width:32px;height:32px;">
            <div style="width:32px;height:32px;border-radius:16px;background:var(--ws-cream);"></div>
            <div style="position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:9px;background:var(--ws-ochre);display:flex;align-items:center;justify-content:center;border:2px solid var(--ws-paper);">
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="4.5" r="2" fill="#fff"/><path d="M2 11c.5-2 2-3 4-3s3.5 1 4 3" stroke="#fff" stroke-width="1.4"/></svg>
            </div>
          </div>
          <span style="font-size:12px;color:var(--ws-fg);font-weight:500;">フォロー</span>
        </div>
      
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ws-paper);border:1px solid var(--ws-hairline);border-radius:12px;">
          <div style="position:relative;width:32px;height:32px;">
            <div style="width:32px;height:32px;border-radius:16px;background:var(--ws-cream);"></div>
            <div style="position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:9px;background:var(--ws-ink);display:flex;align-items:center;justify-content:center;border:2px solid var(--ws-paper);">
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 6h6M3 3h6M3 9h6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
            </div>
          </div>
          <span style="font-size:12px;color:var(--ws-fg);font-weight:500;">システム</span>
        </div>
      
    </div>
  </body></html>
