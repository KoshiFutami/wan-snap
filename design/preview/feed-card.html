<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Feed card · mini</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px; background: var(--ws-bg);
    color: var(--ws-fg); font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em;
    min-height: 380px;
  }
  * { box-sizing: border-box; }
  .eb {
    font: 500 9.5px/1 var(--ws-font-sans);
    text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--ws-fg-faint);
  }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
</style></head>
<body>

    <div class="eb">Feed card · 写真主役、メタ最小</div>
    <div style="margin-top:14px;max-width:380px;background:var(--ws-paper);border-radius:18px;overflow:hidden;border:1px solid var(--ws-hairline);">
      <div style="padding:12px 14px 10px;display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;border-radius:18px;background:url('https://images.unsplash.com/photo-1568393691622-c7ba131d63b4?w=300&auto=format') center/cover;"></div>
        <div style="flex:1;">
          <div style="display:flex;align-items:baseline;gap:6px;">
            <span style="font-size:13px;font-weight:600;">エマ</span>
            <span style="font-size:10.5px;color:var(--ws-fg-faint);">@koushi_to_ema</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:3px;">
            <span style="font-size:10.5px;color:var(--ws-fg-muted);font-weight:500;display:inline-flex;align-items:center;gap:4px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="var(--ws-terracotta)"><ellipse cx="6" cy="9" rx="2" ry="2.6"/><ellipse cx="11" cy="6.4" rx="2" ry="2.6"/><ellipse cx="16.3" cy="7.6" rx="2" ry="2.6"/><ellipse cx="20" cy="11.5" rx="1.8" ry="2.3"/><path d="M12 11c-3.5 0-6.5 2.6-6.5 5.8 0 2 1.5 3.4 3.5 3.4 1.2 0 2.2-.6 3-.6s1.8.6 3 .6c2 0 3.5-1.4 3.5-3.4 0-3.2-3-5.8-6.5-5.8z"/></svg>
              柴犬
            </span>
            <span style="width:2px;height:2px;border-radius:2px;background:var(--ws-ink-30);"></span>
            <span style="font-size:10.5px;color:var(--ws-fg-muted);">赤</span>
            <span style="width:2px;height:2px;border-radius:2px;background:var(--ws-ink-30);"></span>
            <span class="mono" style="font-size:10.5px;color:var(--ws-fg-muted);font-weight:500;">9.5kg</span>
          </div>
        </div>
        <div style="font-size:10.5px;color:var(--ws-fg-faint);">11分前</div>
      </div>
      <div style="position:relative;width:100%;aspect-ratio:4/5;background:url('https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?w=900&auto=format&fit=crop') center/cover;">
        <div style="position:absolute;top:10px;right:10px;padding:4px 8px;border-radius:9999px;background:rgba(31,26,20,0.55);backdrop-filter:blur(10px);color:#fff;font-size:10px;font-weight:500;display:inline-flex;align-items:center;gap:5px;">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M2 2h6l6 6-6 6-6-6V2z" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><circle cx="5" cy="5" r="1" fill="#fff"/></svg>
          2 アイテム
        </div>
      </div>
      <div style="padding:12px 14px 14px;">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;color:var(--ws-fg);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20.5s-7.5-4.7-7.5-10.2c0-2.7 2-4.8 4.5-4.8 1.8 0 2.7 1 3 1.7.3-.7 1.2-1.7 3-1.7 2.5 0 4.5 2.1 4.5 4.8 0 5.5-7.5 10.2-7.5 10.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="mono" style="font-size:12px;font-weight:500;">428</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11h-9l-4 3.5V16H4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="mono" style="font-size:12px;font-weight:500;">34</span>
          <div style="flex:1;"></div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 4h12v17l-6-3.5L6 21V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-size:13px;line-height:1.5;color:var(--ws-fg);">
          <span style="font-weight:600;">エマ</span>
          <span style="color:var(--ws-fg-muted);margin-left:8px;">新宿中央公園で初めてのバンダナデビュー🌿</span>
        </div>
      </div>
    </div>
  
</body></html>
