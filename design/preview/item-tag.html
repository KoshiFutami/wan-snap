<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Item tag · point + label</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px; background: var(--ws-bg);
    color: var(--ws-fg); font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em;
    min-height: 320px;
  }
  * { box-sizing: border-box; }
  .eb {
    font: 500 9.5px/1 var(--ws-font-sans);
    text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--ws-fg-faint);
  }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    padding: 12px 22px; border-radius: 9999px; border: none;
    font: 600 13px/1 var(--ws-font-sans); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    letter-spacing: 0.02em;
  }
  .btn-primary { background: var(--ws-ink); color: var(--ws-cream); }
  .btn-terra   { background: var(--ws-terracotta); color: #fff; box-shadow: 0 6px 18px rgba(185,90,61,0.35); }
  .btn-ghost   { background: var(--ws-paper); color: var(--ws-fg); border: 1px solid var(--ws-hairline-strong); }
  .btn-danger  { background: transparent; color: var(--ws-terracotta); border: 1px solid var(--ws-terracotta); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px;
    background: var(--ws-paper); border: 1px solid var(--ws-hairline);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ws-fg); cursor: pointer; padding: 0;
  }
  .chip {
    padding: 7px 13px; border-radius: 9999px;
    border: 1px solid var(--ws-hairline-strong);
    background: transparent; color: var(--ws-fg);
    font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip-on { background: var(--ws-ink); color: var(--ws-cream); border-color: var(--ws-ink); }
  .chip-on-terra { background: var(--ws-terracotta); color: #fff; border-color: var(--ws-terracotta); }
  .dot { width: 6px; height: 6px; border-radius: 6px; background: var(--ws-terracotta); }
</style></head>
<body>

    <div class="eb">Item tag · 写真上のアイテムタグ（編集的スタイル）</div>
    <div style="margin-top:14px;position:relative;width:560px;height:240px;border-radius:14px;overflow:hidden;background:url('https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?w=900&auto=format&fit=crop') center/cover;">
      <!-- Tag 1 -->
      <div style="position:absolute;left:46%;top:42%;">
        <div style="position:absolute;width:10px;height:10px;border-radius:10px;background:#fff;border:2px solid var(--ws-ink);left:-5px;top:-5px;box-shadow:0 0 0 4px rgba(31,26,20,0.15);"></div>
        <div style="position:absolute;width:22px;height:1px;background:#fff;left:5px;top:-0.5px;opacity:0.9;"></div>
        <div style="position:absolute;left:27px;top:-16px;background:#fff;padding:7px 11px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,0.2);white-space:nowrap;">
          <div style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ws-fg-faint);font-weight:600;">TRUE LOVE</div>
          <div style="font-size:11.5px;font-weight:500;color:var(--ws-fg);margin-top:1px;">リネンバンダナ</div>
        </div>
      </div>
      <!-- Tag 2 (left side) -->
      <div style="position:absolute;left:55%;top:70%;">
        <div style="position:absolute;width:10px;height:10px;border-radius:10px;background:#fff;border:2px solid var(--ws-ink);left:-5px;top:-5px;box-shadow:0 0 0 4px rgba(31,26,20,0.15);"></div>
        <div style="position:absolute;width:22px;height:1px;background:#fff;left:-27px;top:-0.5px;"></div>
        <div style="position:absolute;right:27px;top:-16px;background:#fff;padding:7px 11px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,0.2);white-space:nowrap;">
          <div style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ws-fg-faint);font-weight:600;">Mandarine Bros.</div>
          <div style="font-size:11.5px;font-weight:500;color:var(--ws-fg);margin-top:1px;">パピーハーネス</div>
        </div>
      </div>
    </div>
    <div style="margin-top:14px;font-size:11px;color:var(--ws-fg-faint);line-height:1.5;max-width:600px;">
      Dot: 白塗 + ink 2pxボーダー + 15% inkハロー / 接続線: 1px白 / カード: 白 + 9pxラベル(uppercase) + 11.5px商品名
    </div>
  
</body></html>
