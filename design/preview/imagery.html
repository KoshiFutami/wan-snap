<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Imagery & placeholder</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px; background: var(--ws-bg);
    color: var(--ws-fg); font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em;
    min-height: 340px;
  }
  * { box-sizing: border-box; }
  .eb { font: 500 9.5px/1 var(--ws-font-sans); text-transform: uppercase; letter-spacing: 0.2em; color: var(--ws-fg-faint); }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
</style></head>
<body>
    <div class="eb">Imagery · 写真ファースト · 縦長プロポーション</div>

    <div style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
      <div>
        <div style="width:100%;aspect-ratio:4/5;border-radius:12px;background:url('https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?w=600&auto=format&fit=crop') center/cover;"></div>
        <div style="font-size:10.5px;color:var(--ws-fg);margin-top:8px;font-weight:500;">4 / 5 — Primary</div>
        <div style="font-size:10px;color:var(--ws-fg-faint);margin-top:2px;">フィード・モーダル詳細</div>
      </div>
      <div>
        <div style="width:100%;aspect-ratio:1;border-radius:12px;background:url('https://images.unsplash.com/photo-1583511655826-05700d52f4d9?w=600&auto=format&fit=crop') center/cover;"></div>
        <div style="font-size:10.5px;color:var(--ws-fg);margin-top:8px;font-weight:500;">1 / 1 — Square</div>
        <div style="font-size:10px;color:var(--ws-fg-faint);margin-top:2px;">グリッド・サムネ</div>
      </div>
      <div>
        <div style="width:100%;aspect-ratio:3/4;border-radius:12px;background:url('https://images.unsplash.com/photo-1612536057832-2ff7ead58194?w=600&auto=format&fit=crop') center/cover;"></div>
        <div style="font-size:10.5px;color:var(--ws-fg);margin-top:8px;font-weight:500;">3 / 4 — Masonry</div>
        <div style="font-size:10px;color:var(--ws-fg-faint);margin-top:2px;">マソンリーグリッド</div>
      </div>
    </div>

    <div class="eb" style="margin-top:22px;">Placeholder · 画像が未指定のとき</div>
    <div style="margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:600px;">
      <div style="width:100%;aspect-ratio:4/5;border-radius:12px;background:var(--ws-ink-10);position:relative;overflow:hidden;border:1px dashed var(--ws-hairline-strong);">
        <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(45deg, rgba(31,26,20,0.04) 0, rgba(31,26,20,0.04) 4px, transparent 4px, transparent 10px);"></div>
        <div style="position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-family:var(--ws-font-mono);font-size:10px;color:var(--ws-fg-faint);letter-spacing:0.06em;">DOG PHOTO 4/5</div>
      </div>
      <div style="width:100%;aspect-ratio:1;border-radius:12px;background:var(--ws-ink-10);position:relative;overflow:hidden;border:1px dashed var(--ws-hairline-strong);">
        <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(45deg, rgba(31,26,20,0.04) 0, rgba(31,26,20,0.04) 4px, transparent 4px, transparent 10px);"></div>
        <div style="position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-family:var(--ws-font-mono);font-size:10px;color:var(--ws-fg-faint);letter-spacing:0.06em;">SQUARE</div>
      </div>
      <div style="width:100%;aspect-ratio:1;border-radius:9999px;background:var(--ws-ink-10);position:relative;overflow:hidden;border:1px dashed var(--ws-hairline-strong);">
        <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(45deg, rgba(31,26,20,0.04) 0, rgba(31,26,20,0.04) 4px, transparent 4px, transparent 10px);"></div>
        <div style="position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-family:var(--ws-font-mono);font-size:10px;color:var(--ws-fg-faint);letter-spacing:0.06em;">AVATAR</div>
      </div>
    </div>
  </body></html>
