<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px; background: var(--ws-bg);
    color: var(--ws-fg); font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em;
    min-height: 280px;
  }
  * { box-sizing: border-box; }
  .eb {
    font: 500 9.5px/1 var(--ws-font-sans);
    text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--ws-fg-faint);
  }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    padding: 12px 22px; border-radius: 9999px; border: none;
    font: 600 13px/1 var(--ws-font-sans); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    letter-spacing: 0.02em;
  }
  .btn-primary { background: var(--ws-ink); color: var(--ws-cream); }
  .btn-terra   { background: var(--ws-terracotta); color: #fff; box-shadow: 0 6px 18px rgba(185,90,61,0.35); }
  .btn-ghost   { background: var(--ws-paper); color: var(--ws-fg); border: 1px solid var(--ws-hairline-strong); }
  .btn-danger  { background: transparent; color: var(--ws-terracotta); border: 1px solid var(--ws-terracotta); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px;
    background: var(--ws-paper); border: 1px solid var(--ws-hairline);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ws-fg); cursor: pointer; padding: 0;
  }
  .chip {
    padding: 7px 13px; border-radius: 9999px;
    border: 1px solid var(--ws-hairline-strong);
    background: transparent; color: var(--ws-fg);
    font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip-on { background: var(--ws-ink); color: var(--ws-cream); border-color: var(--ws-ink); }
  .chip-on-terra { background: var(--ws-terracotta); color: #fff; border-color: var(--ws-terracotta); }
  .dot { width: 6px; height: 6px; border-radius: 6px; background: var(--ws-terracotta); }
</style></head>
<body>

    <div class="eb">Buttons · Primary / Terracotta / Ghost / Danger</div>
    <div class="row" style="margin-top:16px;">
      <button class="btn btn-primary">スナップを表示</button>
      <button class="btn btn-terra">+ スナップを投稿</button>
      <button class="btn btn-ghost">プロフィール編集</button>
      <button class="btn btn-danger">削除</button>
    </div>
    <div style="margin-top:22px;">
      <div class="eb">Icon buttons · 40×40</div>
      <div class="row" style="margin-top:10px;">
        <div class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/>
            <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="7" r="3.2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M3.5 17c.8-3.4 3.5-5 6.5-5s5.7 1.6 6.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M3 5h14M5 10h10M7 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M14 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>
    <div style="margin-top:18px;font-size:11px;color:var(--ws-fg-faint);line-height:1.5;">
      Primary は <span class="mono">--ws-ink</span> + <span class="mono">--ws-cream</span> / Terracotta は CTA 専用 / Ghost は外周 hairline / Danger は外枠のみ
    </div>
  
</body></html>
