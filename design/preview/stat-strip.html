<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<title>Stat strip</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body {
    padding: 24px; background: var(--ws-bg);
    color: var(--ws-fg); font-family: var(--ws-font-sans);
    -webkit-font-smoothing: antialiased; letter-spacing: 0.005em;
    min-height: 200px;
  }
  * { box-sizing: border-box; }
  .eb {
    font: 500 9.5px/1 var(--ws-font-sans);
    text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--ws-fg-faint);
  }
  .mono { font-family: var(--ws-font-mono); letter-spacing: -0.02em; }
</style></head>
<body>

    <div class="eb">Stat strip · 4-column metric row</div>
    <div style="margin-top:14px;padding:16px 4px;background:var(--ws-paper);border-radius:18px;border:1px solid var(--ws-hairline);display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;">
      
        <div style="text-align:center;padding:0 8px;">
          <div class="eb" style="margin-bottom:4px;">犬種</div>
          <div style="display:flex;align-items:baseline;justify-content:center;gap:2px;">
            <span style="font-family:var(--ws-font-serif);font-size:20px;font-weight:500;color:var(--ws-fg);letter-spacing:-0.01em;line-height:1;">柴犬</span>
            
          </div>
          <div style="font-size:9.5px;color:var(--ws-terracotta);margin-top:3px;font-weight:500;">赤</div>
        </div>
      
        <div style="text-align:center;padding:0 8px;border-left:1px solid var(--ws-hairline);">
          <div class="eb" style="margin-bottom:4px;">体重</div>
          <div style="display:flex;align-items:baseline;justify-content:center;gap:2px;">
            <span style="font-family:var(--ws-font-serif);font-size:20px;font-weight:500;color:var(--ws-fg);letter-spacing:-0.01em;line-height:1;">9.5</span>
            <span class="mono" style="font-size:10px;color:var(--ws-fg-faint);">kg</span>
          </div>
          <div style="font-size:9.5px;color:var(--ws-terracotta);margin-top:3px;font-weight:500;">標準</div>
        </div>
      
        <div style="text-align:center;padding:0 8px;border-left:1px solid var(--ws-hairline);">
          <div class="eb" style="margin-bottom:4px;">胴囲</div>
          <div style="display:flex;align-items:baseline;justify-content:center;gap:2px;">
            <span style="font-family:var(--ws-font-serif);font-size:20px;font-weight:500;color:var(--ws-fg);letter-spacing:-0.01em;line-height:1;">48</span>
            <span class="mono" style="font-size:10px;color:var(--ws-fg-faint);">cm</span>
          </div>
          <div style="font-size:9.5px;color:var(--ws-terracotta);margin-top:3px;font-weight:500;">M</div>
        </div>
      
        <div style="text-align:center;padding:0 8px;border-left:1px solid var(--ws-hairline);">
          <div class="eb" style="margin-bottom:4px;">年齢</div>
          <div style="display:flex;align-items:baseline;justify-content:center;gap:2px;">
            <span style="font-family:var(--ws-font-serif);font-size:20px;font-weight:500;color:var(--ws-fg);letter-spacing:-0.01em;line-height:1;">2</span>
            <span class="mono" style="font-size:10px;color:var(--ws-fg-faint);">y4m</span>
          </div>
          <div style="font-size:9.5px;color:var(--ws-terracotta);margin-top:3px;font-weight:500;">若犬</div>
        </div>
      
    </div>
    <div style="margin-top:12px;font-size:10.5px;color:var(--ws-fg-faint);line-height:1.5;max-width:520px;">
      左から順にプライマリ → 数値メトリクス。区切りは hairline 1px。サブラベルは terracotta で意味づけ。
    </div>
  
</body></html>
