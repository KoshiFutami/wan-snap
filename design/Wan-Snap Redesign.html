<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Wan-Snap · Redesign</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: "Zen Kaku Gothic New", -apple-system, system-ui, sans-serif;
    background: #ECE4D6;
    -webkit-font-smoothing: antialiased;
    color: #1F1A14;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }
  img { -webkit-user-drag: none; user-select: none; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="nav.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="screen-home.jsx"></script>
<script type="text/babel" src="screen-explore.jsx"></script>
<script type="text/babel" src="screen-search.jsx"></script>
<script type="text/babel" src="screen-profile.jsx"></script>
<script type="text/babel" src="screen-detail.jsx"></script>
<script type="text/babel" src="screen-auth.jsx"></script>
<script type="text/babel" src="screen-post.jsx"></script>
<script type="text/babel" src="screen-dog.jsx"></script>
<script type="text/babel" src="screen-user.jsx"></script>
<script type="text/babel" src="screen-misc.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const T = WS_TOKENS;
const F = WS_FONTS;

// ──────────────────────────────────────────────────────
// Phone frame — minimal black bezel around 390x844 screen
// ──────────────────────────────────────────────────────
function Phone({ children }) {
  return (
    <div style={{
      width: 410, padding: 10, borderRadius: 50,
      background: '#1B1612',
      boxShadow: '0 30px 60px -20px rgba(31,26,20,0.35), 0 0 0 1px rgba(0,0,0,0.04)',
    }}>
      <div style={{
        width: 390, height: 844, borderRadius: 42,
        overflow: 'hidden', background: T.cream,
        position: 'relative',
      }}>
        {/* Dynamic island */}
        <div style={{
          position: 'absolute', top: 12, left: '50%',
          transform: 'translateX(-50%)',
          width: 124, height: 36, borderRadius: 22,
          background: '#000', zIndex: 50,
        }}/>
        {children}
      </div>
    </div>
  );
}

// Cover artboard — design system intro card
function CoverArtboard() {
  return (
    <div style={{
      width: 410, height: 864, padding: '64px 56px',
      background: T.creamSoft, borderRadius: 50,
      border: `1px solid ${T.hairline}`,
      display: 'flex', flexDirection: 'column',
      justifyContent: 'space-between',
      fontFamily: F.sans,
      position: 'relative', overflow: 'hidden',
    }}>
      {/* Decorative serif punctuation */}
      <div style={{
        position: 'absolute', bottom: -120, right: -80,
        fontFamily: F.serif, fontSize: 580, color: T.terracotta,
        opacity: 0.12, fontWeight: 500, lineHeight: 0.7, letterSpacing: '-0.05em',
      }}>。</div>

      <div style={{ position: 'relative' }}>
        <div style={{
          fontSize: 10, letterSpacing: '0.24em', textTransform: 'uppercase',
          color: T.ink50, fontWeight: 500, marginBottom: 16,
        }}>App redesign · v2 · May 2026</div>
        <div style={{
          fontFamily: F.serif, fontSize: 68, fontWeight: 500,
          color: T.ink, letterSpacing: '-0.025em', lineHeight: 0.95,
        }}>Wan<br/>Snap<span style={{ color: T.terracotta }}>.</span></div>
        <div style={{
          marginTop: 28, fontSize: 15, color: T.ink70,
          lineHeight: 1.65, maxWidth: 280,
        }}>
          犬種ごとに、サイズ感と着こなしが見つかる。<br/>
          美しさを大事にする愛犬家のための<br/>
          ファッションスナップ・コミュニティ。
        </div>
      </div>

      {/* Palette swatches */}
      <div style={{ position: 'relative' }}>
        <div style={{
          fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase',
          color: T.ink50, marginBottom: 14, fontWeight: 500,
        }}>Palette</div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 24 }}>
          {[
            { c: T.cream, n: 'Cream' },
            { c: T.paper, n: 'Paper' },
            { c: T.ink, n: 'Ink' },
            { c: T.terracotta, n: 'Terra' },
            { c: T.forest, n: 'Forest' },
            { c: T.ochre, n: 'Ochre' },
          ].map(({ c, n }) => (
            <div key={n} style={{ flex: 1 }}>
              <div style={{
                width: '100%', aspectRatio: '1', borderRadius: 10,
                background: c, border: `1px solid ${T.hairline}`,
              }}/>
              <div style={{
                fontSize: 9, marginTop: 6, color: T.ink70,
                letterSpacing: '0.04em',
              }}>{n}</div>
            </div>
          ))}
        </div>

        {/* Type */}
        <div style={{
          fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase',
          color: T.ink50, marginBottom: 8, fontWeight: 500,
        }}>Type</div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 16, marginBottom: 4 }}>
          <div style={{
            fontFamily: F.serif, fontSize: 28, fontWeight: 500,
            color: T.ink, letterSpacing: '-0.01em', lineHeight: 1,
          }}>Noto Serif JP</div>
          <div style={{ fontSize: 10, color: T.ink50 }}>Display · 見出し</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}>
          <div style={{
            fontFamily: F.sans, fontSize: 18, fontWeight: 500,
            color: T.ink, letterSpacing: '0', lineHeight: 1,
          }}>Zen Kaku Gothic New</div>
          <div style={{ fontSize: 10, color: T.ink50 }}>Body · 本文</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas minScale={0.12} maxScale={1.5}>
      <DCSection
        id="overview"
        title="00 · Overview"
        subtitle="デザインシステムの紹介とカバー。"
      >
        <DCArtboard id="cover" label="Cover" width={410} height={864}>
          <CoverArtboard/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="core"
        title="01 · コア体験"
        subtitle="毎日触る画面群。写真ファースト、編集的な見せ方。"
      >
        <DCArtboard id="home" label="ホーム · フィード" width={410} height={864}>
          <Phone><HomeScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="explore" label="発見 · マソンリー" width={410} height={864}>
          <Phone><ExploreScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="search-results" label="検索結果" width={410} height={864}>
          <Phone><SearchResultsScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="search" label="絞り込み (モーダル)" width={410} height={864}>
          <Phone><SearchScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="detail" label="スナップ詳細" width={410} height={864}>
          <Phone><DetailScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="notifications" label="通知" width={410} height={864}>
          <Phone><NotificationsScreen/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="profile"
        title="02 · プロフィール"
        subtitle="自分・他人・愛犬・アルバムの見せ方。"
      >
        <DCArtboard id="my-profile" label="マイわん (自分)" width={410} height={864}>
          <Phone><MyProfileScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="other-profile" label="他ユーザー" width={410} height={864}>
          <Phone><OtherProfileScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="dog-profile" label="愛犬プロフィール" width={410} height={864}>
          <Phone><ProfileScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="album" label="アルバム · 成長記録" width={410} height={864}>
          <Phone><AlbumScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="edit-profile" label="プロフィール編集" width={410} height={864}>
          <Phone><EditProfileScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="edit-dog" label="愛犬プロフィール編集" width={410} height={864}>
          <Phone><EditDogScreen/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="creation"
        title="03 · 投稿フロー"
        subtitle="新規投稿とその編集。アイテムタグ付け体験を中心に。"
      >
        <DCArtboard id="new-post" label="新規投稿 (タグ付け)" width={410} height={864}>
          <Phone><NewPostScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="edit-post" label="投稿編集" width={410} height={864}>
          <Phone><EditPostScreen/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="onboarding"
        title="04 · 認証 / オンボーディング"
        subtitle="サインイン・サインアップ・愛犬登録の3ステップ。"
      >
        <DCArtboard id="sign-in" label="サインイン" width={410} height={864}>
          <Phone><SignInScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="sign-up" label="新規登録 (1/3)" width={410} height={864}>
          <Phone><SignUpScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="new-dog" label="愛犬登録 (2/3)" width={410} height={864}>
          <Phone><NewDogScreen/></Phone>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
