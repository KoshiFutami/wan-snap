[build]
dockerfilePath = "apps/api/Dockerfile"
dockerContext = "."
dockerTarget = "production"

[deploy]
startCommand = "sh -c 'npx prisma migrate resolve --applied 20260520000000_replace_auth_with_supabase 2>/dev/null || true && npx prisma migrate deploy && node dist/main'"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
